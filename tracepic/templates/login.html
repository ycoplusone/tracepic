{% extends "base.html" %}
{% block title %}로그인 · TracePic{% endblock %}
{% block main_class %}login-wrap{% endblock %}

{% block content %}
<section class="login-card">
  <h1 class="brand-lg">TracePic</h1>
  <p class="sub">나만의 여행 기록</p>

  {# 로그인 실패 / 시도 제한 / 비밀번호 변경 안내 메시지 #}
  {% include "_flash.html" %}

  <form method="post" action="{{ url_for('auth.login') }}" autocomplete="on">
    <input type="hidden" name="next" value="{{ next }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="user_id">아이디 <span class="muted small">(메일로 가입했다면 메일 주소)</span></label>
    <input id="user_id" name="user_id" type="text" value="{{ user_id or '' }}"
           autocomplete="username" autocapitalize="off" required autofocus>
    <label for="password">비밀번호</label>
    <input id="password" name="password" type="password"
           autocomplete="current-password" required>
    <button type="submit" class="btn-primary">로그인</button>
  </form>
  <p class="login-links small">
    <a href="{{ url_for('account.password_forgot') }}">비밀번호 찾기</a>
    <span class="muted" aria-hidden="true">·</span>
    <a href="{{ url_for('account.signup') }}">가입 신청</a>
  </p>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}새 비밀번호 · TracePic{% endblock %}
{% block main_class %}login-wrap{% endblock %}

{% block content %}
{# 재설정 2단계: 코드 + 새 비밀번호 #}
<section class="login-card">
  <h1 class="brand-lg">새 비밀번호</h1>
  <p class="sub"><strong>{{ email }}</strong> 로 받은 코드와 새 비밀번호를 입력하세요.</p>
  {% include "_flash.html" %}
  <form method="post" action="{{ url_for('account.password_reset') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="code">인증 코드</label>
    <input id="code" name="code" class="code-input" inputmode="numeric" pattern="\d{6}" maxlength="6"
           autocomplete="one-time-code" required autofocus>
    <label for="password">새 비밀번호 <span class="muted small">({{ min_len }}자 이상)</span></label>
    <input id="password" name="password" type="password" minlength="{{ min_len }}" autocomplete="new-password" required>
    <label for="password2">새 비밀번호 확인</label>
    <input id="password2" name="password2" type="password" minlength="{{ min_len }}" autocomplete="new-password" required>
    <button type="submit" class="btn-primary">비밀번호 바꾸기</button>
  </form>
  <form method="post" action="{{ url_for('account.password_resend') }}" class="login-links small">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    메일이 안 왔나요? (스팸함도 확인)
    <button type="submit" class="btn-link small">코드 다시 받기</button>
    · <a href="{{ url_for('account.password_forgot') }}">메일 주소 바꾸기</a>
  </form>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}가입 신청 완료 · TracePic{% endblock %}
{% block main_class %}login-wrap{% endblock %}

{% block content %}
<section class="login-card">
  <h1 class="brand-lg">신청 완료</h1>
  <p class="sub"><strong>{{ email }}</strong> 메일 인증이 끝났습니다.</p>
  <p>관리자가 승인하면 메일로 알려 드립니다. 승인된 뒤 이 메일 주소와 비밀번호로 로그인하세요.</p>
  <a class="btn-primary btn-block" href="{{ url_for('auth.login') }}">로그인 화면으로</a>
</section>
{% endblock %}

{% extends "base.html" %}
{% block title %}비밀번호 찾기 · TracePic{% endblock %}
{% block main_class %}login-wrap{% endblock %}

{% block content %}
{# 재설정 1단계: 가입한 메일 → 인증 코드 #}
<section class="login-card">
  <h1 class="brand-lg">비밀번호 찾기</h1>
  <p class="sub">계정에 등록된 메일로 인증 코드를 보내 드립니다.</p>
  {% include "_flash.html" %}
  <form method="post" action="{{ url_for('account.password_forgot') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">메일 주소</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" maxlength="50"
           autocomplete="email" autocapitalize="off" required autofocus>
    <button type="submit" class="btn-primary">인증 코드 받기</button>
  </form>
  <p class="login-links small"><a href="{{ url_for('auth.login') }}">로그인으로 돌아가기</a></p>
</section>
{% endblock %}
